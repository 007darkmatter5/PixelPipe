# Overlay for a Linux host with the NVIDIA container toolkit.
# libnvidia-encode and libcuda come from the host driver, not from the image.
#
#   docker compose -f docker-compose.yml -f docker-compose.nvidia.yml up --build
services:
  pixelpipe:
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,video,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
