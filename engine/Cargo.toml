[package]
name = "pixelpipe-engine"
version = "0.1.0"
edition = "2021"
description = "PixelPipe libretro capture, encode, and WebRTC engine"
readme = "../README.md"
default-run = "pixelpipe-engine"

[lib]
name = "pixelpipe_engine"
path = "src/lib.rs"

[[bin]]
name = "pixelpipe-engine"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.7"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
crc32fast = "1"
ffmpeg-next = { version = "6.1", default-features = false, features = ["codec", "format", "software-scaling"] }
futures = "0.3"
libc = "0.2"
libloading = "0.8"
opus = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
webrtc = "0.17"

[target.'cfg(windows)'.dependencies]
windows-service = "0.7"
