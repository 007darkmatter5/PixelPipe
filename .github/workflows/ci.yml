name: CI

on:
  push:
  pull_request:

jobs:
  engine:
    # ffmpeg-next 6.1 bindgen includes libavcodec/avfft.h, removed in FFmpeg 7.
    # ubuntu-latest has moved past that header; 24.04 still ships FFmpeg 6.1.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config clang libclang-dev \
            libavcodec-dev libavformat-dev libavutil-dev \
            libswscale-dev libswresample-dev libopus-dev unzip curl
      - name: Test and build the engine
        run: cargo test --release --locked --manifest-path engine/Cargo.toml
      - name: Run the homebrew ROMs through each core
        run: |
          bash scripts/fetch-cores.sh
          # cargo test does not always leave the final binary at target/release/.
          cargo run --release --locked --manifest-path engine/Cargo.toml -- --self-test
          cargo run --release --locked --manifest-path engine/Cargo.toml -- --self-test \
            --core cores/snes9x_libretro.so --rom roms/homebrew/pixelpipe-snes-test.sfc
          cargo run --release --locked --manifest-path engine/Cargo.toml -- --self-test \
            --core cores/genesis_plus_gx_libretro.so --rom roms/homebrew/pixelpipe-genesis-test.gen

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Install LLVM and Inno Setup
        shell: pwsh
        run: |
          choco install llvm innosetup --no-progress -y
          # 3010 means the installer requested a reboot. The tools are usable now.
          if ($LASTEXITCODE -eq 3010) { exit 0 }
      - name: Build the engine, UI, and installer
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: PixelPipe-Setup
          path: dist/PixelPipe-Setup.exe
          if-no-files-found: error

  ui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build the Blazor UI
        run: dotnet build ui/PixelPipe.Web/PixelPipe.Web.csproj -c Release --nologo
