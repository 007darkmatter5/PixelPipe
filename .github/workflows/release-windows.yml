name: Release Windows installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish, for example v0.2.0-preview"
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Install LLVM and Inno Setup
        shell: pwsh
        run: |
          choco install llvm innosetup --no-progress -y
          # 3010 means the installer requested a reboot. The tools are usable now.
          if ($LASTEXITCODE -eq 3010) { exit 0 }
      - name: Build the installer
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Silently install, smoke-test, and uninstall
        shell: pwsh
        run: ./scripts/test-windows-install.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-install-log
          path: dist/install*.log
          if-no-files-found: warn
      - name: Publish the pre-release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: ./scripts/publish-github-release.ps1
